name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: fleetlint
        uses: ./
        with:
          fail-on: never
          sarif-file: ${{ runner.temp }}/fleetlint.sarif
      - name: The release ran and wrote SARIF
        shell: bash
        run: |
          test -n "${{ steps.fleetlint.outputs.version }}"
          test -s "$RUNNER_TEMP/fleetlint.sarif"
      - name: pr refuses to run without a token, and pull requests only check
        shell: bash
        env:
          INPUT_PATH: .
          INPUT_REF: main
          INPUT_DEFAULT_BRANCH: main
          FLEETLINT_TOKEN: ""
        run: |
          if INPUT_EVENT=push ./pr.sh >"$RUNNER_TEMP/pr.log" 2>&1; then exit 1; fi
          grep -q "needs a token" "$RUNNER_TEMP/pr.log"
          INPUT_EVENT=pull_request ./pr.sh | grep -q "only checks"
          INPUT_EVENT=push INPUT_REF=feature ./pr.sh | grep -q "only runs of main"
      - name: an onboarding run is not gated
        shell: bash
        env:
          INPUT_PATH: .
          INPUT_FAIL_ON: info
          INPUT_ANNOTATIONS: "false"
          INPUT_SUMMARY: "false"
          INPUT_SARIF_FILE: ""
          INPUT_GATE: "false"
        run: ./check.sh | grep -q "not gated"
      - name: annotations auto annotate on GitHub only
        shell: bash
        env:
          INPUT_PATH: .
          INPUT_FAIL_ON: never
          INPUT_ANNOTATIONS: auto
          INPUT_SUMMARY: "false"
          INPUT_SARIF_FILE: ""
        run: |
          ./check.sh >"$RUNNER_TEMP/github.log"
          grep -q '^::' "$RUNNER_TEMP/github.log"
          FORGEJO_ACTIONS=true ./check.sh >"$RUNNER_TEMP/forgejo.log"
          if grep -q '^::' "$RUNNER_TEMP/forgejo.log"; then exit 1; fi
