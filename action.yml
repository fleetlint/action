name: fleetlint
description: Check a repository's setup (hooks, task runner, lint config, CI, release) against its fleetlint rules.
author: fleetlint
branding:
  icon: check-square
  color: blue
inputs:
  pr:
    description: "On runs of the default branch (not pull requests), also open or update a pull request: the onboarding configuration when the repository has none (that run is not gated), else the mechanical fixes."
    default: "false"
  token:
    description: "Token for pr. The run's own token needs contents: write and pull-requests: write; pull requests it opens do not start workflows, a GitHub App or fine-grained token does."
    default: ${{ github.token }}
  version:
    description: fleetlint release to install, such as v0.2.0, or "latest".
    default: latest
  path:
    description: Repository root to check, relative to the workspace.
    default: .
  fail-on:
    description: "Lowest severity that fails the step: error, warning, info or never."
    default: error
  annotations:
    description: "Annotate every finding on the run and, on pull requests, on the changed files: true, false, or auto (on GitHub only; Gitea and Forgejo do not show annotations)."
    default: auto
  summary:
    description: Write the report into the job summary.
    default: "true"
  sarif-file:
    description: Also write a SARIF report to this path, for github/codeql-action/upload-sarif.
    default: ""
  verify:
    description: "How to verify the download: auto (cosign signature when cosign is on PATH, else checksum), cosign, or checksum."
    default: auto
outputs:
  version:
    description: The fleetlint version that ran.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERIFY: ${{ inputs.verify }}
      run: '"$GITHUB_ACTION_PATH/install.sh"'
    - id: pr
      if: inputs.pr == 'true'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EVENT: ${{ github.event_name }}
        INPUT_REF: ${{ github.ref_name }}
        INPUT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FLEETLINT_TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/pr.sh"'
    - shell: bash
      env:
        INPUT_GATE: ${{ steps.pr.outputs.onboarding != 'true' }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: '"$GITHUB_ACTION_PATH/check.sh"'
